name: Renomear branch para main
on:
  push:
    branches: [ otoscopio-app ]
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/branches/otoscopio-app/rename -f new_name=main
